# Docker Compose for Local Development
# Mirrors production AWS infrastructure locally
#
# Usage:
#   docker-compose up -d        # Start all services
#   docker-compose down         # Stop all services
#   docker-compose logs -f app  # Follow app logs

version: '3.9'

services:
  # ============================================================
  # TypeScript Application
  # ============================================================
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    container_name: your-app-dev
    restart: unless-stopped
    ports:
      - '3000:3000'
      - '9229:9229'  # Node.js debugger port
    volumes:
      # Mount source for hot-reload
      - ..:/app
      - /app/node_modules  # Exclude node_modules from mount
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/appdb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret-key-minimum-32-chars-long
      AWS_REGION: us-east-1
      # Use LocalStack for AWS services locally
      AWS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    command: npm run dev

  # ============================================================
  # PostgreSQL Database (mirrors RDS)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: your-app-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --locale=en_US.UTF-8'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d appdb']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================
  # Redis Cache (mirrors ElastiCache)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: your-app-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 60 1000
        --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================
  # LocalStack (AWS services locally: S3, Secrets Manager, etc.)
  # ============================================================
  localstack:
    image: localstack/localstack:3
    container_name: your-app-localstack
    restart: unless-stopped
    ports:
      - '4566:4566'
    environment:
      SERVICES: s3,secretsmanager,sqs,sns
      DEBUG: 0
      PERSISTENCE: 1
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    networks:
      - app-network

  # ============================================================
  # Adminer - Database UI (development only)
  # ============================================================
  adminer:
    image: adminer:4-standalone
    container_name: your-app-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      - postgres
    networks:
      - app-network
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

  # ============================================================
  # Redis Commander - Redis UI (development only)
  # ============================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: your-app-redis-commander
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - app-network
    profiles:
      - tools

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  localstack-data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
